---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Build

on:
  push:
    branches: ["main"]
    paths: ["apps/**"]
  pull_request:
    paths: ["apps/**"]
  workflow_dispatch:
    inputs:
      app:
        description: App to build (overrides change detection)
        required: true

permissions:
  contents: read

jobs:
  changed:
    name: Detect changed apps
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.detect.outputs.apps }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Detect
        id: detect
        env:
          MANUAL_APP: ${{ github.event.inputs.app }}
        run: |
          if [ -n "${MANUAL_APP}" ]; then
            echo "apps=[\"${MANUAL_APP}\"]" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mapfile -t dirs < <(git diff --name-only HEAD^ HEAD \
            | grep '^apps/' | cut -d/ -f2 | sort -u)
          json=$(printf '%s\n' "${dirs[@]}" | jq -R 'select(length>0)' | jq -cs .)
          echo "apps=${json}" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.app }}
    needs: changed
    if: needs.changed.outputs.apps != '[]' && needs.changed.outputs.apps != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJson(needs.changed.outputs.apps) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Read app version
        id: ver
        env:
          APP: ${{ matrix.app }}
        run: |
          ver=$(awk '
            /variable[[:space:]]+"VERSION"/ { inblock=1 }
            inblock && /default[[:space:]]*=/ {
              if (match($0, /"([^"]+)"/, a)) { print a[1]; exit }
            }' "apps/${APP}/docker-bake.hcl")
          echo "version=${ver}" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.app }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ steps.ver.outputs.version }},enable=${{ github.event_name != 'pull_request' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.ver.outputs.version }},enable=${{ github.event_name != 'pull_request' }}
            type=semver,pattern={{major}},value=${{ steps.ver.outputs.version }},enable=${{ github.event_name != 'pull_request' }}
            type=raw,value=rolling,enable=${{ github.event_name != 'pull_request' }}
            type=sha

      - name: Build${{ github.event_name != 'pull_request' && ' and push' || '' }}
        uses: docker/bake-action@v5
        with:
          files: |
            ./apps/${{ matrix.app }}/docker-bake.hcl
            cwd://${{ steps.meta.outputs.bake-file }}
          targets: image-all
          set: |
            *.args.VENDOR=${{ github.repository_owner }}
            *.labels.org.opencontainers.image.title=${{ matrix.app }}
            *.labels.org.opencontainers.image.revision=${{ github.sha }}
            *.output=type=image,push=${{ github.event_name != 'pull_request' }}
